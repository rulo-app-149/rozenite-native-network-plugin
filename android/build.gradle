buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.6.0"
  }
}

apply plugin: "com.android.library"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.rozenite.nativenetwork"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Version is aligned by the React Native Gradle plugin applied in the app.
  implementation "com.facebook.react:react-android"
  // React Native already ships OkHttp; this only makes the API visible at
  // compile time. Gradle resolves to whichever version the app uses.
  compileOnly "com.squareup.okhttp3:okhttp:4.12.0"
}
